<!DOCTYPE html>
<html>

<head>
    <title>Product List</title>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>
    <h1>Available Products</h1>
    <table>
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Price (PHP)</th>
            </tr>
        </thead>
        <tbody>
            {% for product in product_data %}
            <tr>
                <td>{{ product.name }}</td>
                <td>{{ product.price }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>

</html>

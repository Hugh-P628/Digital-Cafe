<h1>Product List</h1>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
        <tr>
            <th>Product Name</th>
            <th>Product Price (₱)</th>
        </tr>
    </thead>
    <tbody>
        {% for product in product_data %}
        <tr>
            <td>{{ product.name }}</td>
            <td>₱{{ product.price }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
